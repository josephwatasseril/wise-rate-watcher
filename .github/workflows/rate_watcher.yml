name: Check Wise Exchange Rates

on:
  workflow_dispatch:

concurrency:
  group: wise-rate-watcher
  cancel-in-progress: true

jobs:
  check-rate:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install requests

      - name: Restore State Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fx-state-${{ github.run_id }}
          restore-keys: |
            fx-state-

      - name: Run Wise Rate Watcher
        env:
          SOURCE_CURRENCY: ${{ vars.SOURCE_CURRENCY }}
          TARGET_CURRENCY: ${{ vars.TARGET_CURRENCY }}
          INITIAL_THRESHOLD: ${{ vars.INITIAL_THRESHOLD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_rate.py

      - name: Prune Caches Older Than 10 Minutes
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CUTOFF=$(date -u -d '10 minutes ago' +%s)
          gh api "/repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("fx-state-")) | select(((.created_at[0:19] + "Z") | fromdateiso8601) < '$CUTOFF') | .id' \
          | while read -r cache_id; do
            echo "Deleting old cache ID: $cache_id"
            gh api --method DELETE "/repos/$REPO/actions/caches/$cache_id"
          done

      - name: Prune Workflow Runs Older Than 10 Minutes
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CUTOFF=$(date -u -d '10 minutes ago' +%s)
          gh api --paginate "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(((.created_at[0:19] + "Z") | fromdateiso8601) < '$CUTOFF') | .id' \
          | while read -r run_id; do
            echo "Deleting run ID: $run_id"
            gh api --method DELETE "/repos/$REPO/actions/runs/$run_id"
          done